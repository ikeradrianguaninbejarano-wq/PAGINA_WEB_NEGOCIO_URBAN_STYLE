name: CI/CD Urban Style

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tailwind-version/package-lock.json

      - name: Instalar dependencias
        working-directory: ./tailwind-version
        run: npm ci

      - name: Construir CSS
        working-directory: ./tailwind-version
        run: npm run build

      - name: Ejecutar pruebas unitarias
        working-directory: ./tailwind-version
        run: npm test

      - name: Validar HTML5
        working-directory: ./tailwind-version
        run: npm run lint:html

      - name: Revisar semántica, ARIA y seguridad
        working-directory: ./tailwind-version
        run: npm run lint:quality

      - name: Instalar navegador Chromium para accesibilidad
        working-directory: ./tailwind-version
        run: npx playwright install --with-deps chromium

      - name: Iniciar servidor local
        working-directory: ./tailwind-version
        run: node scripts/serve.js &

      - name: Ejecutar pruebas accesibilidad y responsividad
        working-directory: ./tailwind-version
        env:
          TEST_URL: http://127.0.0.1:8000
        run: npm run test:browser

  deploy-pages:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./tailwind-version

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
